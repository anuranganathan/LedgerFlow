# Local development: the whole system, with LocalStack standing in for AWS.
services:
  api:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
    environment: &app-environment
      DATABASE_URL: postgresql+psycopg2://payflow:payflow@postgres:5432/payflow
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AWS_REGION: ap-south-1
      AWS_ENDPOINT_URL: http://localstack:4566
      # LocalStack accepts any credentials; these are not real AWS keys.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: ledgerflow-receipts
      SQS_QUEUE_NAME: ledgerflow-notifications
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on: &app-dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      aws-setup:
        condition: service_completed_successfully

  worker:
    build: .
    command: python worker.py
    volumes:
      - .:/app
    environment: *app-environment
    depends_on: *app-dependencies

  notifier:
    build: .
    command: python notifier.py
    volumes:
      - .:/app
    environment: *app-environment
    depends_on: *app-dependencies

  # Runs setup_aws.py once to create the bucket, queues and CloudWatch alarm, then exits.
  aws-setup:
    build: .
    command: python setup_aws.py
    environment: *app-environment
    depends_on:
      localstack:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3,sqs,cloudwatch,logs,sns

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  postgres_data:
  kafka_data:
