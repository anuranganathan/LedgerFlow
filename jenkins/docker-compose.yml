# Runs Jenkins locally at http://localhost:8080
#   docker compose -f jenkins/docker-compose.yml up -d --build
# The initial admin password is printed by:
#   docker compose -f jenkins/docker-compose.yml exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
services:
  jenkins:
    build: .
    user: root  # needed to use the host's Docker socket
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
